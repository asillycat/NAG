[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nag"
version = "0.1.0"
description = "NAG: target-oriented pretraining data selection via Neuron-Activated Graphs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.45,<5.0",
    "accelerate>=0.30",
    "datasets>=2.18",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "tqdm",
]

[project.optional-dependencies]
analysis = [
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.urls]
Paper = "https://arxiv.org/"

[tool.setuptools.packages.find]
include = ["nag*"]
